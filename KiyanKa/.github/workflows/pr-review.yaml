name: PR Review with ChatGPT

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install required packages
      run: |
        pip install openai requests

    - name: Send PR data to ChatGPT for review
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        PR_URL="https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
        PR_DETAILS=$(curl -s $PR_URL)

        PR_TITLE=$(echo $PR_DETAILS | jq -r '.title')
        PR_BODY=$(echo $PR_DETAILS | jq -r '.body')
        PR_USER=$(echo $PR_DETAILS | jq -r '.user.login')

        REVIEW_TEXT="Title: $PR_TITLE\n\nBody: $PR_BODY\n\nUser: $PR_USER"

        # Send PR data to ChatGPT for review
        curl https://api.openai.com/v1/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -d '{
            "model": "gpt-4",
            "messages": [{"role": "system", "content": "You are a code reviewer."},
                         {"role": "user", "content": "Please review the following PR: ' + REVIEW_TEXT + '"}],
            "max_tokens": 500
          }'
